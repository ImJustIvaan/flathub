app-id: cc.ivaan.MinimalClock
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: minimal_clock

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: minimal-clock
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt/minimal_clock
      - cp -r opt/minimal_clock/. /app/opt/minimal_clock/
      - mkdir -p /app/bin
      - ln -s ../opt/minimal_clock/minimal_clock /app/bin/minimal_clock
      - install -Dm644 cc.ivaan.MinimalClock.desktop /app/share/applications/cc.ivaan.MinimalClock.desktop
      - install -Dm644 usr/share/icons/hicolor/512x512/apps/com.ImJustIvaan.MinimalClock.png /app/share/icons/hicolor/512x512/apps/cc.ivaan.MinimalClock.png
      - install -Dm644 cc.ivaan.MinimalClock.metainfo.xml /app/share/metainfo/cc.ivaan.MinimalClock.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/ImJustIvaan/Minimal-Clock-Desktop/releases/download/v1.0.0/MinimalClock-linux-bundle.tar.gz
        sha256: 56e7bbe93483f3a642259d8a2cb6cd860bbe46c80ccdd52784b853c612a03a5b
      - type: file
        path: cc.ivaan.MinimalClock.metainfo.xml
      - type: file
        path: cc.ivaan.MinimalClock.desktop
